spring.application.name=careerflow
server.port=${PORT:8080}
server.address=0.0.0.0

# ---------- MongoDB Atlas ----------
# Replace the placeholder with your Atlas connection string
# (Atlas -> Connect -> Drivers). Or set the MONGODB_URI environment variable.
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}
# Creates the unique index on users.email automatically
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX_CREATION:true}
# ---------- JWT ----------
# Secret must be at least 32 characters. Change it for production
# (or set the JWT_SECRET environment variable).
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS ----------
# Frontend origin(s), comma separated
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Stop Spring Boot from creating its default in-memory user (we use our own users)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
